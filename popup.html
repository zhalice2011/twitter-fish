<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #0f1419;
      margin: 0;
    }
    h3 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 700;
    }
    .site-label {
      font-size: 11px;
      color: #536471;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .row + .row {
      border-top: 1px solid #eff3f4;
    }
    .divider {
      border: none;
      border-top: 1px solid #eff3f4;
      margin: 8px 0;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #cfd9de;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: #1d9bf0;
    }
    .toggle input:checked + .slider.slider-purple {
      background: #68217a;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(18px);
    }
    .row.hidden, .section.hidden, .divider.hidden {
      display: none !important;
    }
    .section-label {
      font-size: 11px;
      color: #536471;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 4px 0;
    }
    .empty-state {
      padding: 12px 0;
      color: #536471;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>Web Fish</h3>
  <div class="site-label" id="siteLabel">未识别站点</div>

  <div class="empty-state hidden" id="emptyState">
    本扩展暂不支持当前站点。<br>
    支持：x.com / twitter.com / linux.do
  </div>

  <div class="section" id="sectionVscode">
    <div class="section-label">伪装模式</div>
    <div class="row" id="rowVscode">
      <span>VSCode 模式</span>
      <label class="toggle">
        <input type="checkbox" id="vscodeMode">
        <span class="slider slider-purple"></span>
      </label>
    </div>
    <hr class="divider">
  </div>

  <div class="section" id="sectionAds">
    <div class="section-label">广告</div>
    <div class="row" id="rowAds">
      <span>去除广告</span>
      <label class="toggle">
        <input type="checkbox" id="hideAds">
        <span class="slider"></span>
      </label>
    </div>
    <hr class="divider">
  </div>

  <div class="section" id="sectionMedia">
    <div class="section-label">媒体控制</div>
    <div class="row" id="rowImages">
      <span>隐藏图片</span>
      <label class="toggle">
        <input type="checkbox" id="hideImages">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row" id="rowVideos">
      <span>隐藏视频</span>
      <label class="toggle">
        <input type="checkbox" id="hideVideos">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="shared/match.js"></script>
  <script src="popup.js"></script>
</body>
</html>
