<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #0f1419;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .row + .row {
      border-top: 1px solid #eff3f4;
    }
    .divider {
      border: none;
      border-top: 1px solid #eff3f4;
      margin: 8px 0;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #cfd9de;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: #1d9bf0;
    }
    .toggle input:checked + .slider.slider-purple {
      background: #68217a;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(18px);
    }
    .row.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .section-label {
      font-size: 11px;
      color: #536471;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <h3>Twitter Fish</h3>

  <div class="section-label">伪装模式</div>
  <div class="row">
    <span>VSCode 模式</span>
    <label class="toggle">
      <input type="checkbox" id="vscodeMode">
      <span class="slider slider-purple"></span>
    </label>
  </div>

  <hr class="divider">

  <div class="section-label">广告</div>
  <div class="row">
    <span>去除广告</span>
    <label class="toggle">
      <input type="checkbox" id="hideAds">
      <span class="slider"></span>
    </label>
  </div>

  <hr class="divider">

  <div class="section-label">广告</div>
  <div class="row">
    <span>去除广告</span>
    <label class="toggle">
      <input type="checkbox" id="hideAds">
      <span class="slider"></span>
    </label>
  </div>

  <hr class="divider">

  <div class="section-label">媒体控制</div>
  <div class="row" id="rowImages">
    <span>隐藏图片</span>
    <label class="toggle">
      <input type="checkbox" id="hideImages">
      <span class="slider"></span>
    </label>
  </div>
  <div class="row" id="rowVideos">
    <span>隐藏视频</span>
    <label class="toggle">
      <input type="checkbox" id="hideVideos">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
